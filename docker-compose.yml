services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: leerlingenraad
      POSTGRES_PASSWORD: leerlingenraad
      POSTGRES_DB: leerlingenraad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leerlingenraad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
